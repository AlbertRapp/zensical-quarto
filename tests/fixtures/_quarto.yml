# Test fixtures: one page per feature. check_site.py copies this folder to
# tests/_build/, renders it with the zensical-gfm format and builds it with
# the example site's zensical.toml.
project:
  type: default
  output-dir: docs
  render:
    - "*.qmd"
  resources:
    - "*.bib"

format: zensical-gfm
