[project]
name = "quarto-zensical"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "jupyter==1.1.1",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "plotly==6.3.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "tabulate==0.10.0",
    "watchfiles==1.3.0",
    "zensical==0.0.73",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["check_site.py"]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
