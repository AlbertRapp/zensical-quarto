# Zensical configuration for the quarto-zensical example site.
# docs/ is generated by `quarto render` from src/ -- edit src/, not docs/.
[project]
site_url = "https://example.com/quarto-zensical/"
site_name = "Quarto × Zensical"
site_description = "Executable Quarto documents, built as a Zensical site."
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Introduction" = "index.md" },
  { "Callouts and tabs" = "callouts-tabs.md" },
  { "Data analysis" = "analysis.md" },
  { "Math and citations" = "math-citations.md" },
]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
  "https://cdn.plot.ly/plotly-3.1.0.min.js",
  "javascripts/zensical-plotly.js",
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Listing extensions replaces Zensical's defaults, so everything the
# Quarto output relies on is listed explicitly.
[project.markdown_extensions]
abbr = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.blocks.admonition = {}
pymdownx.blocks.details = {}
pymdownx.blocks.tab.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
