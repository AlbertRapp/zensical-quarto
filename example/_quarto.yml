# Quarto renders the .qmd files in this folder to Markdown in docs/,
# which Zensical then builds into site/ (see zensical.toml).
project:
  type: default
  output-dir: docs
  render:
    - "*.qmd"
  resources:
    - "javascripts/*"

format: zensical-gfm

execute:
  freeze: auto
  warning: false

bibliography: references.bib
