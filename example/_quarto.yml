# Quarto renders the .qmd files in this folder to Markdown in docs/,
# then post-render runs Zensical, which builds docs/ into site/
# (see zensical.toml).
project:
  type: default
  post-render: "zensical build --clean"
  output-dir: docs
  render:
    - "*.qmd"
  resources:
    - "javascripts/*"

format: zensical-gfm


execute:
  freeze: auto
  warning: false

knitr:
  opts_chunk:
    collapse: true

bibliography: references.bib
