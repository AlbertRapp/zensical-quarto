project:
  type: default
  output-dir: docs
  render:
    - "src/*.qmd"
  resources:
    - "src/javascripts/*"
    - "src/*.bib"
  # Quarto mirrors src/ into docs/src/; move it up so Zensical sees docs/*.md
  post-render: _scripts/flatten_docs.py

format: zensical-gfm

execute:
  freeze: auto
  warning: false

bibliography: src/references.bib
